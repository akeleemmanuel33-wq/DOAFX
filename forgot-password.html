<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — DOAFX</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card" id="request-view">
      <div class="auth-logo">
        <img src="images/logo.png" alt="DOAFX logo" />
        DOAFX
      </div>

      <h1>Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="form-error-banner" id="form-error"></div>

      <form id="forgot-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
          <span class="btn-label">Send Reset Link</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer-link"><a href="login.html">Back to log in</a></p>
    </div>

    <div class="auth-card card" id="sent-view" style="display:none;">
      <div class="auth-logo">
        <img src="images/logo.png" alt="DOAFX logo" />
        DOAFX
      </div>
      <div class="auth-status">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto var(--space-sm);">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22 6 12 13 2 6"/>
        </svg>
        <h1>Check your inbox</h1>
        <p class="auth-subtitle">A password reset link is on its way to your email.</p>
      </div>
      <p class="auth-footer-link"><a href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const formError = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError(formError);

      const email = document.getElementById('email').value.trim();
      setButtonLoading(submitBtn, true);

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/reset-password.html`,
      });

      setButtonLoading(submitBtn, false);

      if (error) {
        showFormError(formError, error.message);
        return;
      }

      document.getElementById('request-view').style.display = 'none';
      document.getElementById('sent-view').style.display = 'block';
    });
  </script>
</body>
</html>
