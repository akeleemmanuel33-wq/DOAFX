      <main class="main">
        <div class="page-header">
          <div>
            <h1>Confirm Payment</h1>
            <p>Upload your receipt and reconfirm your plan to complete your request.</p>
          </div>
        </div>

        <div class="payment-summary card" style="max-width: 480px;">
          <div class="form-error-banner" id="form-error"></div>

          <form id="confirm-form">
            <div class="field-group">
              <label class="field-label">Upload Receipt</label>
              <div class="upload-zone" id="upload-zone">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p>Click to upload or drag your receipt here</p>
                <input type="file" id="receipt-input" accept="image/*,.pdf" style="display:none;" required />
              </div>
              <div class="upload-preview" id="upload-preview">
                <img id="preview-img" src="" alt="Receipt preview" />
                <span id="preview-name" class="field-hint"></span>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label">Reconfirm Plan Paid For</label>
              <div class="plan-radio-group" id="plan-radio-group">
                <!-- populated by JS -->
              </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
              <span class="btn-label">Submit & Notify Admin</span>
              <span class="spinner"></span>
            </button>
          </form>
        </div>
      </main>
    </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/sw-register.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/payment-flow.js"></script>
  <script>
    let selectedPlanId = getPlanIdFromQuery();
    let selectedFile = null;

    async function loadPlanOptions() {
      const { data: plans } = await supabaseClient.from('plans').select('*').order('duration_seconds');
      const group = document.getElementById('plan-radio-group');

      group.innerHTML = plans.map((p) => `
        <label class="plan-radio ${p.id === selectedPlanId ? 'selected' : ''}" data-plan-option="${p.id}">
          <input type="radio" name="plan" value="${p.id}" ${p.id === selectedPlanId ? 'checked' : ''} />
          ${p.label} — ₦${Number(p.price_ngn).toLocaleString()}
        </label>
      `).join('');

      group.querySelectorAll('.plan-radio').forEach((label) => {
        label.addEventListener('click', () => {
          group.querySelectorAll('.plan-radio').forEach((l) => l.classList.remove('selected'));
          label.classList.add('selected');
          selectedPlanId = label.dataset.planOption;
        });
      });
    }

    document.getElementById('upload-zone').addEventListener('click', () => {
      document.getElementById('receipt-input').click();
    });

    document.getElementById('receipt-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;

      const preview = document.getElementById('upload-preview');
      const previewImg = document.getElementById('preview-img');
      const previewName = document.getElementById('preview-name');

      previewName.textContent = file.name;
      if (file.type.startsWith('image/')) {
        previewImg.src = URL.createObjectURL(file);
        previewImg.style.display = 'block';
      } else {
        previewImg.style.display = 'none';
      }
      preview.classList.add('visible');
    });

    document.getElementById('confirm-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formError = document.getElementById('form-error');
      const submitBtn = document.getElementById('submit-btn');
      hideFormError(formError);

      if (!selectedFile) {
        showFormError(formError, 'Please upload your payment receipt.');
        return;
      }
      if (!selectedPlanId) {
        showFormError(formError, 'Please select the plan you paid for.');
        return;
      }

      setButtonLoading(submitBtn, true);

      try {
        const receiptPath = await uploadReceipt(currentUser.id, selectedFile);
        await submitPaymentConfirmation({
          userId: currentUser.id,
          planId: selectedPlanId,
          receiptPath,
        });

        const { data: planData } = await supabaseClient.from('plans').select('label').eq('id', selectedPlanId).single();
        const waLink = buildWhatsAppLink(planData?.label || selectedPlanId, currentProfile?.display_name);

        setButtonLoading(submitBtn, false);
        window.location.href = waLink;
      } catch (err) {
        setButtonLoading(submitBtn, false);
        showFormError(formError, err.message || 'Something went wrong. Please try again.');
      }
    });

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      await loadPlanOptions();
    })();
  </script>
