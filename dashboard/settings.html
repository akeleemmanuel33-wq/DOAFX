  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

    <aside class="sidebar" id="sidebar">

      </div>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a href="subscribe.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Subscribe
      </a>
      <a href="settings.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
      <a href="customer-care.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        Customer Care
      </a>
      <div class="sidebar-footer">
        <button class="sidebar-link" data-logout style="width: 100%; text-align: left;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div>
      <div class="topbar">
        <div class="topbar-logo">
          <img src="../images/logo.png" alt="DOAFX logo" />
          DOAFX
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="icon-btn" id="sidebar-toggle" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Settings</h1>
            <p>Manage your account details.</p>
          </div>
        </div>

        <div class="card" style="max-width: 520px; overflow: hidden;">

          <div class="settings-hero">
            <div class="settings-avatar-wrap">
              <div class="settings-avatar-img" id="avatar-preview">?</div>
              <button type="button" class="avatar-camera-btn" id="avatar-camera-btn" aria-label="Change profile photo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </button>
              <input type="file" id="avatar-input" accept="image/*" style="display:none;" />
            </div>
            <div class="settings-username" id="hero-username">@username</div>
            <button type="button" class="settings-change-photo" id="change-photo-link">Change profile photo</button>
          </div>

          <div class="settings-list">
            <div class="form-error-banner" id="form-error"></div>
            <div class="form-error-banner" id="form-success" style="background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: var(--success);"></div>

            <form id="settings-form">
              <div class="settings-row" style="animation-delay: 0.05s;">
                <div class="settings-row-label">Username</div>
                <div class="settings-row-field">
                  <div class="settings-input-wrap">
                    <input class="settings-input-flat" type="text" id="username" disabled />
                  </div>
                  <p class="settings-row-hint">Cannot be changed after account creation.</p>
                </div>
              </div>

              <div class="settings-row" style="animation-delay: 0.12s;">
                <div class="settings-row-label">Name</div>
                <div class="settings-row-field">
                  <div class="settings-input-wrap">
                    <input class="settings-input-flat" type="text" id="display_name" placeholder="Your display name" />
                  </div>
                </div>
              </div>

              <div class="settings-row" style="animation-delay: 0.19s;">
                <div class="settings-row-label">Bio</div>
                <div class="settings-row-field">
                  <div class="settings-input-wrap">
                    <textarea class="settings-input-flat textarea" id="bio" maxlength="150" placeholder="Tell us a bit about yourself…"></textarea>
                  </div>
                  <div class="char-counter" id="char-counter">0 / 150</div>
                </div>
              </div>

              <div class="settings-save-bar">
                <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
                  <span class="btn-label">Save Changes</span>
                  <span class="spinner"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let selectedAvatarFile = null;
    let initialValues = {};

    function updateAvatarPreview(url, fallbackLetter) {
      const preview = document.getElementById('avatar-preview');
      if (url) {
        preview.innerHTML = `<img src="${url}" alt="Avatar" />`;
      } else {
        preview.textContent = fallbackLetter || '?';
      }
    }

    function updateCharCounter() {
      const bio = document.getElementById('bio').value;
      const counter = document.getElementById('char-counter');
      counter.textContent = `${bio.length} / 150`;
      counter.classList.remove('warn', 'over');
      if (bio.length >= 150) counter.classList.add('over');
      else if (bio.length >= 120) counter.classList.add('warn');
    }

    function checkDirty() {
      const displayName = document.getElementById('display_name').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const isDirty = displayName !== initialValues.display_name || bio !== initialValues.bio || !!selectedAvatarFile;
      document.getElementById('submit-btn').disabled = !isDirty;
    }

    async function loadProfile() {
      document.getElementById('username').value = currentProfile.username;
      document.getElementById('hero-username').textContent = `@${currentProfile.username}`;
      document.getElementById('display_name').value = currentProfile.display_name || '';
      document.getElementById('bio').value = currentProfile.bio || '';
      updateAvatarPreview(currentProfile.avatar_url, (currentProfile.display_name || currentProfile.username || '?')[0].toUpperCase());
      updateCharCounter();

      initialValues = {
        display_name: currentProfile.display_name || '',
        bio: currentProfile.bio || '',
      };
    }

    document.getElementById('avatar-camera-btn').addEventListener('click', () => {
      document.getElementById('avatar-input').click();
    });
    document.getElementById('change-photo-link').addEventListener('click', () => {
      document.getElementById('avatar-input').click();
    });

    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedAvatarFile = file;
      updateAvatarPreview(URL.createObjectURL(file));
      checkDirty();
    });

    document.getElementById('display_name').addEventListener('input', checkDirty);
    document.getElementById('bio').addEventListener('input', () => {
      updateCharCounter();
      checkDirty();
    });

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formError = document.getElementById('form-error');
      const formSuccess = document.getElementById('form-success');
      const submitBtn = document.getElementById('submit-btn');
      const avatarPreview = document.getElementById('avatar-preview');
      hideFormError(formError);
      formSuccess.style.display = 'none';
      submitBtn.classList.remove('save-success');

      if (!currentProfile || !currentUser) {
        showFormError(formError, 'Your session hasn\'t finished loading. Please refresh the page and try again.');
        return;
      }

      setButtonLoading(submitBtn, true);

      try {
        let avatarUrl = currentProfile.avatar_url;

        if (selectedAvatarFile) {
          avatarPreview.classList.add('uploading');

          // Clean up previous avatar file(s) for this user before uploading the new one
          const { data: existingFiles } = await supabaseClient.storage
            .from('avatars')
            .list(currentUser.id);

          if (existingFiles && existingFiles.length > 0) {
            const pathsToRemove = existingFiles.map((f) => `${currentUser.id}/${f.name}`);
            await supabaseClient.storage.from('avatars').remove(pathsToRemove);
          }

          const ext = selectedAvatarFile.name.split('.').pop();
          const path = `${currentUser.id}/${Date.now()}.${ext}`;
          const { error: uploadError } = await supabaseClient.storage
            .from('avatars')
            .upload(path, selectedAvatarFile);

          avatarPreview.classList.remove('uploading');

          if (uploadError) throw uploadError;

          const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
          avatarUrl = urlData.publicUrl;
        }

        const newDisplayName = document.getElementById('display_name').value.trim();
        const newBio = document.getElementById('bio').value.trim();

        const { error: updateError } = await supabaseClient
          .from('profiles')
          .update({
            display_name: newDisplayName,
            bio: newBio,
            avatar_url: avatarUrl,
          })
          .eq('id', currentUser.id);

        if (updateError) throw updateError;

        currentProfile.avatar_url = avatarUrl;
        currentProfile.display_name = newDisplayName;
        currentProfile.bio = newBio;
        initialValues = { display_name: newDisplayName, bio: newBio };
        selectedAvatarFile = null;

        setButtonLoading(submitBtn, false);
        submitBtn.querySelector('.btn-label').textContent = 'Saved ✓';
        submitBtn.classList.add('save-success');
        submitBtn.disabled = true;
        setTimeout(() => {
          submitBtn.classList.remove('save-success');
          submitBtn.querySelector('.btn-label').textContent = 'Save Changes';
        }, 1800);

        formSuccess.textContent = 'Changes saved.';
        formSuccess.style.display = 'block';
      } catch (err) {
        avatarPreview.classList.remove('uploading');
        setButtonLoading(submitBtn, false);
        showFormError(formError, err.message || 'Something went wrong.');
      }
    });

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      await loadProfile();
    })();
  </script>
</body>
</html>
