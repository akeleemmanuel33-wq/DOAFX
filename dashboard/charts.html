  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="../js/theme-toggle.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/sw-register.js"></script>
  <script>
    function createWidget() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      new TradingView.widget({
        autosize: true,
        symbol: 'FX:EURUSD',
        interval: 'D',
        timezone: 'Etc/UTC',
        theme: currentTheme === 'light' ? 'light' : 'dark',
        style: '1',
        locale: 'en',
        toolbar_bg: currentTheme === 'light' ? '#fafafa' : '#0a0a0f',
        enable_publishing: false,
        allow_symbol_change: true,
        hide_side_toolbar: false,
        container_id: 'tv-widget-container',
      });
    }

    function loadTradingViewWidget() {
      const container = document.getElementById('tv-widget-container');
      container.innerHTML = ''; // clear before re-creating (needed when theme changes)

      if (window.TradingView) {
        // Script already loaded from a previous call — just rebuild the widget
        createWidget();
        return;
      }

      const script = document.createElement('script');
      script.src = 'https://s3.tradingview.com/tv.js';
      script.onload = createWidget;
      document.body.appendChild(script);
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      loadTradingViewWidget();

      // Re-render the widget whenever the theme is toggled, so the chart
      // actually matches light/dark instead of staying stuck on whatever
      // theme was active at page load.
      document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
        btn.addEventListener('click', () => {
          setTimeout(loadTradingViewWidget, 50); // wait for data-theme attribute to update first
        });
      });
    })();
  </script>
