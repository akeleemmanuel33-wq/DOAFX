    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div>
      <div class="topbar">
        <div class="topbar-logo">
          <img src="../images/logo.png" alt="DOAFX logo" />
          DOAFX
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

          <button class="icon-btn" id="sidebar-toggle" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Proceed to Payment</h1>
            <p>Transfer the exact amount, then continue to confirm your payment.</p>
          </div>
        </div>

        <div class="payment-summary card" id="summary-card">
          <div class="empty-feed">Loading plan…</div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/sw-register.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/payment-flow.js"></script>
  <script>
    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      const planId = getPlanIdFromQuery();
      const summaryCard = document.getElementById('summary-card');

      if (!planId) {
        summaryCard.innerHTML = `<div class="empty-feed">No plan selected. <a href="subscribe.html" style="color: var(--accent);">Go back and choose a plan</a>.</div>`;
        return;
      }

      const plan = await fetchPlan(planId);
      if (!plan) {
        summaryCard.innerHTML = `<div class="empty-feed">Plan not found. <a href="subscribe.html" style="color: var(--accent);">Go back and choose a plan</a>.</div>`;
        return;
      }

      summaryCard.innerHTML = `
        <div class="summary-row">
          <span class="label">Selected Plan</span>
          <span class="value">${plan.label}</span>
        </div>
        <div class="summary-row">
          <span class="label">Amount Due</span>
          <span class="value">₦${Number(plan.price_ngn).toLocaleString()}</span>
        </div>

        <div class="account-box">
          <div class="field-hint">Transfer to</div>
          <div class="account-number">0123456789</div>
          <div class="field-hint">Bank Name — Account Holder Name</div>
        </div>

        <p class="field-hint" style="text-align:center; margin-bottom: var(--space-md);">
          After transferring, continue below to upload your receipt and confirm your plan.
        </p>

        <a href="confirm-payment.html?plan=${plan.id}" class="btn btn-primary" style="width: 100%;">I've Made Payment</a>
      `;
    })();
  </script>
</body>
</html>
