<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — DOAFX</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-logo">
        <img src="images/logo.png" alt="DOAFX logo" />
        DOAFX
      </div>

      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to view your live signals.</p>

      <div class="form-error-banner" id="form-error"></div>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="Your password" required />
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint"><a href="forgot-password.html" style="color: var(--accent);">Forgot password?</a></p>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
          <span class="btn-label">Log In</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const formError = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError(formError);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      setButtonLoading(submitBtn, true);

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      setButtonLoading(submitBtn, false);

      if (error) {
        showFormError(formError, error.message);
        return;
      }

      window.location.href = 'dashboard/index.html';
    });
  </script>
</body>
</html>
