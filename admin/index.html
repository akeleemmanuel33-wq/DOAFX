<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — DOAFX</title>

  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="../images/logo.png" alt="DOAFX logo" />
        DOAFX Admin
      </div>
      <a href="index.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </a>
      <a href="users.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Users
      </a>
      <div class="sidebar-footer">
        <button class="sidebar-link" data-theme-toggle style="width: 100%; text-align: left;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Toggle Theme
        </button>
        <a href="../dashboard/index.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Dashboard
        </a>
        <button class="sidebar-link" data-logout style="width: 100%; text-align: left;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div>
      <div class="topbar">
        <div class="topbar-logo">
          <img src="../images/logo.png" alt="DOAFX logo" />
          DOAFX Admin
        </div>
        <button class="icon-btn" id="sidebar-toggle" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Admin Overview</h1>
            <p>Send a signal and manage your active subscribers.</p>
          </div>
        </div>

        <div class="stat-cards">
          <div class="stat-card card">
            <div class="stat-value" id="stat-active">--</div>
            <div class="stat-label">Active Subscribers</div>
          </div>
          <div class="stat-card card">
            <div class="stat-value" id="stat-pending">--</div>
            <div class="stat-label">Pending Payment Reviews</div>
          </div>
          <div class="stat-card card">
            <div class="stat-value" id="stat-signals">--</div>
            <div class="stat-label">Signals Sent Today</div>
          </div>
        </div>

        <div class="composer-card card">
          <h2 style="font-size: var(--fs-lg); margin-bottom: var(--space-md);">Send a Signal</h2>
          <div class="form-error-banner" id="composer-error"></div>

          <form id="signal-form">
            <div class="field-group">
              <label class="field-label" for="pair">Pair</label>
              <input class="field-input" type="text" id="pair" placeholder="e.g. EUR/USD" required />
            </div>

            <div class="field-group">
              <label class="field-label">Direction</label>
              <div class="direction-toggle">
                <button type="button" class="direction-btn buy selected" data-direction="buy">BUY</button>
                <button type="button" class="direction-btn sell" data-direction="sell">SELL</button>
              </div>
            </div>

            <div class="composer-grid">
              <div class="field-group">
                <label class="field-label" for="entry">Entry Price</label>
                <input class="field-input" type="number" step="any" id="entry" required />
              </div>
              <div class="field-group">
                <label class="field-label" for="sl">Stop Loss</label>
                <input class="field-input" type="number" step="any" id="sl" />
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="tp">Take Profit</label>
              <input class="field-input" type="number" step="any" id="tp" />
            </div>

            <div class="field-group">
              <label class="field-label" for="notes">Notes (optional)</label>
              <input class="field-input" type="text" id="notes" placeholder="Any additional context…" />
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="send-btn">
              <span class="btn-label">Send Signal to All Active Subscribers</span>
              <span class="spinner"></span>
            </button>
          </form>
        </div>

        <div class="feed-section">
          <h2>Your Sent Signals</h2>
          <div id="sent-signals-list">
            <div class="skeleton skeleton-block"></div>
            <div class="skeleton skeleton-block"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/admin-users.js"></script>
  <script>
    let selectedDirection = 'buy';

    document.querySelectorAll('.direction-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.direction-btn').forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedDirection = btn.dataset.direction;
      });
    });

    async function loadStats() {
      const { count: activeCount } = await supabaseClient
        .from('subscriptions')
        .select('*', { count: 'exact', head: true })
        .eq('status', 'active');

      const { count: pendingCount } = await supabaseClient
        .from('payment_submissions')
        .select('*', { count: 'exact', head: true })
        .eq('status', 'pending_review');

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      const { count: signalsToday } = await supabaseClient
        .from('signals')
        .select('*', { count: 'exact', head: true })
        .gte('created_at', startOfDay.toISOString());

      document.getElementById('stat-active').textContent = activeCount ?? 0;
      document.getElementById('stat-pending').textContent = pendingCount ?? 0;
      document.getElementById('stat-signals').textContent = signalsToday ?? 0;
    }

    async function loadSentSignals() {
      const list = document.getElementById('sent-signals-list');
      const { data, error } = await supabaseClient
        .from('signals')
        .select('*')
        .eq('created_by', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(30);

      if (error || !data || data.length === 0) {
        list.innerHTML = `<div class="empty-feed">You haven't sent any signals yet.</div>`;
        return;
      }

      list.innerHTML = data.map((s) => sentSignalRowHTML(s)).join('');
      attachSentSignalHandlers();
    }

    function sentSignalRowHTML(signal) {
      const time = new Date(signal.created_at).toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
      const directionClass = signal.direction === 'buy' ? 'direction-buy' : 'direction-sell';

      return `
        <div class="sent-signal-row card" data-signal-id="${signal.id}" data-view-mode="display">
          <div class="signal-left">
            <span class="signal-pair-name">${signal.pair}</span>
            <span class="direction-tag ${directionClass}">${signal.direction.toUpperCase()}</span>
          </div>
          <div class="signal-details">
            <span>Entry <strong>${signal.entry_price}</strong></span>
            ${signal.stop_loss ? `<span>SL <strong>${signal.stop_loss}</strong></span>` : ''}
            ${signal.take_profit ? `<span>TP <strong>${signal.take_profit}</strong></span>` : ''}
          </div>
          <span class="signal-time">${time}</span>
          <div class="sent-signal-actions">
            <button class="icon-action-btn" data-edit-btn aria-label="Edit signal">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-action-btn danger" data-delete-btn aria-label="Delete signal">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    function signalEditFormHTML(signal) {
      return `
        <form class="signal-edit-form" data-edit-form>
          <div class="field-group">
            <label class="field-label">Pair</label>
            <input class="field-input" type="text" name="pair" value="${signal.pair}" required />
          </div>
          <div class="field-group">
            <label class="field-label">Direction</label>
            <div class="direction-toggle">
              <button type="button" class="direction-btn buy ${signal.direction === 'buy' ? 'selected' : ''}" data-edit-direction="buy">BUY</button>
              <button type="button" class="direction-btn sell ${signal.direction === 'sell' ? 'selected' : ''}" data-edit-direction="sell">SELL</button>
            </div>
            <input type="hidden" name="direction" value="${signal.direction}" />
          </div>
          <div class="field-group">
            <label class="field-label">Entry Price</label>
            <input class="field-input" type="number" step="any" name="entry_price" value="${signal.entry_price}" required />
          </div>
          <div class="field-group">
            <label class="field-label">Stop Loss</label>
            <input class="field-input" type="number" step="any" name="stop_loss" value="${signal.stop_loss ?? ''}" />
          </div>
          <div class="field-group full-width">
            <label class="field-label">Take Profit</label>
            <input class="field-input" type="number" step="any" name="take_profit" value="${signal.take_profit ?? ''}" />
          </div>
          <div class="field-group full-width">
            <label class="field-label">Notes</label>
            <input class="field-input" type="text" name="notes" value="${signal.notes ?? ''}" />
          </div>
          <div class="signal-edit-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" data-cancel-edit>Cancel</button>
          </div>
        </form>
      `;
    }

    function attachSentSignalHandlers() {
      document.querySelectorAll('[data-edit-btn]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('.sent-signal-row');
          const signalId = row.dataset.signalId;

          const { data: signal } = await supabaseClient.from('signals').select('*').eq('id', signalId).single();
          if (!signal) return;

          row.dataset.viewMode = 'edit';
          row.innerHTML = signalEditFormHTML(signal);

          row.querySelectorAll('[data-edit-direction]').forEach((dBtn) => {
            dBtn.addEventListener('click', () => {
              row.querySelectorAll('[data-edit-direction]').forEach((b) => b.classList.remove('selected'));
              dBtn.classList.add('selected');
              row.querySelector('input[name="direction"]').value = dBtn.dataset.editDirection;
            });
          });

          row.querySelector('[data-cancel-edit]').addEventListener('click', () => {
            row.outerHTML = sentSignalRowHTML(signal);
            attachSentSignalHandlers();
          });

          row.querySelector('[data-edit-form]').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const { error } = await supabaseClient
              .from('signals')
              .update({
                pair: formData.get('pair'),
                direction: formData.get('direction'),
                entry_price: formData.get('entry_price'),
                stop_loss: formData.get('stop_loss') || null,
                take_profit: formData.get('take_profit') || null,
                notes: formData.get('notes') || null,
              })
              .eq('id', signalId);

            if (error) {
              alert('Failed to save: ' + error.message);
              return;
            }
            loadSentSignals();
          });
        });
      });

      document.querySelectorAll('[data-delete-btn]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('.sent-signal-row');
          const signalId = row.dataset.signalId;

          if (!confirm('Delete this signal? This cannot be undone.')) return;

          const { error } = await supabaseClient.from('signals').delete().eq('id', signalId);
          if (error) {
            alert('Failed to delete: ' + error.message);
            return;
          }
          loadSentSignals();
          loadStats();
        });
      });
    }

    document.getElementById('signal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('composer-error');
      const sendBtn = document.getElementById('send-btn');
      hideFormError(errorEl);

      const pair = document.getElementById('pair').value.trim();
      const entry = document.getElementById('entry').value;
      const sl = document.getElementById('sl').value || null;
      const tp = document.getElementById('tp').value || null;
      const notes = document.getElementById('notes').value.trim() || null;

      setButtonLoading(sendBtn, true);

      const { error } = await supabaseClient.from('signals').insert({
        pair,
        direction: selectedDirection,
        entry_price: entry,
        stop_loss: sl,
        take_profit: tp,
        notes,
        created_by: currentUser.id,
      });

      setButtonLoading(sendBtn, false);

      if (error) {
        showFormError(errorEl, error.message);
        return;
      }

      document.getElementById('signal-form').reset();
      loadStats();
      loadSentSignals();
    });

    (async () => {
      const auth = await requireAdmin();
      if (!auth) return;
      await loadStats();
      await loadSentSignals();
    })();
  </script>
</body>
</html>
