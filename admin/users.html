<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — DOAFX Admin</title>

  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="../images/logo.png" alt="DOAFX logo" />
        DOAFX Admin
      </div>
      <a href="index.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </a>
      <a href="users.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Users
      </a>
      <div class="sidebar-footer">
        <a href="../dashboard/index.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Dashboard
        </a>
        <button class="sidebar-link" data-logout style="width: 100%; text-align: left;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div>
      <div class="topbar">
        <div class="topbar-logo">
          <img src="../images/logo.png" alt="DOAFX logo" />
          DOAFX Admin
        </div>
        <button class="icon-btn" id="sidebar-toggle" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Users</h1>
            <p>Search and manage subscriber accounts.</p>
          </div>
        </div>

        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search by name or username…" />
        </div>

        <div class="card" style="overflow-x: auto;">
          <table class="user-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Status</th>
                <th>Plan</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <tr><td colspan="3">Loading users…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/dashboard-shell.js"></script>
  <script src="../js/admin-users.js"></script>
  <script>
    let searchTimeout = null;

    function statusPill(sub) {
      if (!sub || sub.length === 0) return '<span class="status-pill inactive">No Plan</span>';
      const s = sub[0];
      return `<span class="status-pill ${s.status}">${s.status}</span>`;
    }

    async function renderUsers(query) {
      const tbody = document.getElementById('user-table-body');
      const users = await searchUsers(query);

      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map((u) => `
        <tr onclick="window.location.href='user-detail.html?id=${u.id}'">
          <td>
            <div class="user-row-name">${u.display_name || 'Unnamed'} ${u.is_suspended ? '<span class="status-pill expired" style="margin-left:6px;">Suspended</span>' : ''}</div>
            <div class="user-row-username">@${u.username}</div>
          </td>
          <td>${statusPill(u.subscriptions)}</td>
          <td>${u.subscriptions?.[0]?.plan_id || '—'}</td>
        </tr>
      `).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => renderUsers(e.target.value), 300);
    });

    (async () => {
      const auth = await requireAdmin();
      if (!auth) return;
      await renderUsers('');
    })();
  </script>
</body>
</html>
