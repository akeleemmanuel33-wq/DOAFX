<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — DOAFX</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-logo">
        <img src="images/logo.png" alt="DOAFX logo" />
        DOAFX
      </div>

      <h1>Create your account</h1>
      <p class="auth-subtitle">Sign up to start receiving live trade signals.</p>

      <div class="form-error-banner" id="form-error"></div>

      <form id="signup-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="display_name">Display Name</label>
          <input class="field-input" type="text" id="display_name" name="display_name" placeholder="e.g. Hemanuel" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="username">Username</label>
          <input class="field-input" type="text" id="username" name="username" placeholder="e.g. hemanuel_fx" required />
          <p class="field-hint">This cannot be changed later — choose carefully.</p>
          <p class="field-error" id="username-error">Username must be 3–20 characters, letters/numbers/underscores only.</p>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="confirm_password">Confirm Password</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-match-error">Passwords do not match.</p>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
          <span class="btn-label">Create Account</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const formError = document.getElementById('form-error');
    const usernameInput = document.getElementById('username');
    const usernameError = document.getElementById('username-error');
    const passwordMatchError = document.getElementById('password-match-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError(formError);
      hideFormError(usernameError);
      hideFormError(passwordMatchError);

      const displayName = document.getElementById('display_name').value.trim();
      const username = usernameInput.value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      let hasError = false;

      if (!isValidUsername(username)) {
        showFormError(usernameError, 'Username must be 3–20 characters, letters/numbers/underscores only.');
        hasError = true;
      }

      if (password !== confirmPassword) {
        showFormError(passwordMatchError, 'Passwords do not match.');
        hasError = true;
      }

      if (hasError) return;

      setButtonLoading(submitBtn, true);

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { username, display_name: displayName },
          emailRedirectTo: `${window.location.origin}/verify-email.html`,
        },
      });

      setButtonLoading(submitBtn, false);

      if (error) {
        showFormError(formError, error.message);
        return;
      }

      window.localStorage.setItem('doafx-pending-email', email);
      window.location.href = 'verify-email.html';
    });
  </script>
</body>
</html>
