<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — DOAFX</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-logo">
        <img src="images/logo.png" alt="DOAFX logo" />
        DOAFX
      </div>

      <h1>Set a new password</h1>
      <p class="auth-subtitle">Choose a new password for your DOAFX account.</p>

      <div class="form-error-banner" id="form-error"></div>

      <form id="reset-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="password">New Password</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="confirm_password">Confirm New Password</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-match-error">Passwords do not match.</p>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
          <span class="btn-label">Update Password</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const formError = document.getElementById('form-error');
    const passwordMatchError = document.getElementById('password-match-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError(formError);
      hideFormError(passwordMatchError);

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (password !== confirmPassword) {
        showFormError(passwordMatchError, 'Passwords do not match.');
        return;
      }

      setButtonLoading(submitBtn, true);
      const { error } = await supabaseClient.auth.updateUser({ password });
      setButtonLoading(submitBtn, false);

      if (error) {
        showFormError(formError, error.message);
        return;
      }

      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
